version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "generated"
        out: "internal/store/generated"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_exact_table_names: false
        rename:
          id: "ID"
